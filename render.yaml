services:
  - type: web
    name: controle-producao
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: controle-producao-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: controle-producao-db
    plan: free
    databaseName: controle_producao
    user: controle_producao
