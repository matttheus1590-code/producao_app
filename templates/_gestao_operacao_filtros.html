<!-- Painel de filtros compartilhado das 3 telas de Gestão Operação (Operação
     360 / Logística / Resultados) — pedido do Bruno, 23/09/2026: "o máximo
     de filtros nas telas, principalmente o que diz respeito a datas
     (planejamento pcp, emissão de nf, saídas e entrada do pedido, região,
     modalidade frete etc)". Extraído do painel que já existia só em
     Operação 360 (era copiado/reduzido nas outras 2 telas, motivo de
     Logística ter ficado pra trás com só 2 campos) — agora as 3 telas usam
     este mesmo arquivo, sempre com o conjunto completo. Cada tela inclui
     este parcial dentro do próprio formulário GET (o form em si fica na
     tela, não aqui, porque cada tela pode precisar de campos extra dentro
     do mesmo form — ex. Resultados com periodo/segmento como hidden inputs).
     Atenção: nunca citar aqui o nome deste arquivo dentro de chaves de
     diretiva de template — o motor de template não respeita o comentário
     HTML e trataria como um include de verdade, causando recursão infinita.

     Variáveis usadas: filtros (dict de _filtrar_pedidos_operacao),
     endpoint_limpar (nome da rota atual, pro botão "Limpar filtros"),
     GO_SEMANAS_PCP/GO_STATUS_PEDIDO_OPCOES/FRETE_OPCOES/REGIOES_OPCOES
     (globais, via inject_globals). -->

<div class="row g-2 align-items-end mb-2">
  <div class="col-md-3">
    <label class="form-label small text-muted mb-1">Buscar (pedido, cliente)</label>
    <input type="text" class="form-control" name="busca" value="{{ filtros.busca }}">
  </div>
  <div class="col-md-2">
    <label class="form-label small text-muted mb-1">Vendedor</label>
    <input type="text" class="form-control" name="vendedor" value="{{ filtros.vendedor }}">
  </div>
  <div class="col-md-2">
    <label class="form-label small text-muted mb-1">Região</label>
    <select class="form-select" name="regiao">
      <option value="">Todas</option>
      {% for r in REGIOES_OPCOES %}
        <option value="{{ r }}" {% if filtros.regiao == r %}selected{% endif %}>{{ r }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-2">
    <label class="form-label small text-muted mb-1">Incluído de</label>
    <input type="date" class="form-control" name="data_inicio" value="{{ filtros.data_inicio }}">
  </div>
  <div class="col-md-2">
    <label class="form-label small text-muted mb-1">Incluído até</label>
    <input type="date" class="form-control" name="data_fim" value="{{ filtros.data_fim }}">
  </div>
  <div class="col-md-1 d-grid">
    <button class="btn btn-primary" type="submit" title="Filtrar"><i class="bi bi-search"></i></button>
  </div>
</div>

<div class="row g-2 align-items-end mb-2">
  <div class="col-md-3">
    <label class="form-label small text-muted mb-1">Planejamento semanal (PCP)</label>
    <select class="form-select" name="planejamento_semanal">
      <option value="">Todas as semanas</option>
      {% for semana in GO_SEMANAS_PCP %}
        <option value="{{ semana }}" {% if filtros.planejamento_semanal == semana %}selected{% endif %}>{{ semana }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-2">
    <label class="form-label small text-muted mb-1">Planejamento mensal (PCP)</label>
    <input type="month" class="form-control" name="planejamento_mensal" value="{{ filtros.planejamento_mensal }}">
  </div>
  <div class="col-md-2">
    <label class="form-label small text-muted mb-1">Mês NF emitida</label>
    <input type="month" class="form-control" name="nf_mes" value="{{ filtros.nf_mes }}">
  </div>
  <div class="col-md-2">
    <label class="form-label small text-muted mb-1">NF emitida de</label>
    <input type="date" class="form-control" name="nf_data_inicio" value="{{ filtros.nf_data_inicio }}">
  </div>
  <div class="col-md-2">
    <label class="form-label small text-muted mb-1">NF emitida até</label>
    <input type="date" class="form-control" name="nf_data_fim" value="{{ filtros.nf_data_fim }}">
  </div>
</div>

<div class="row g-2 align-items-end mb-2">
  <div class="col-md-3">
    <label class="form-label small text-muted mb-1">Expedido de</label>
    <input type="date" class="form-control" name="expedicao_inicio" value="{{ filtros.expedicao_inicio }}">
  </div>
  <div class="col-md-3">
    <label class="form-label small text-muted mb-1">Expedido até</label>
    <input type="date" class="form-control" name="expedicao_fim" value="{{ filtros.expedicao_fim }}">
  </div>
  <div class="col-md-3">
    <label class="form-label small text-muted mb-1">Entregue de</label>
    <input type="date" class="form-control" name="entrega_inicio" value="{{ filtros.entrega_inicio }}">
  </div>
  <div class="col-md-3">
    <label class="form-label small text-muted mb-1">Entregue até</label>
    <input type="date" class="form-control" name="entrega_fim" value="{{ filtros.entrega_fim }}">
  </div>
</div>

<div class="row g-2 align-items-start">
  <div class="col-md-3">
    <label class="form-label small text-muted mb-1">Status produção</label>
    <select class="form-select" name="status_pedido" multiple size="5" title="Ctrl+clique (ou Cmd, no Mac) pra selecionar mais de uma opção">
      {% for op in GO_STATUS_PEDIDO_OPCOES %}
        <option value="{{ op.valor }}" {% if op.valor in filtros.status_pedido %}selected{% endif %}>{{ op.emoji }} {{ op.label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-2">
    <label class="form-label small text-muted mb-1">OTD</label>
    <select class="form-select" name="otd" multiple size="5" title="Ctrl+clique (ou Cmd, no Mac) pra selecionar mais de uma opção">
      <option value="SIM" {% if "SIM" in filtros.otd %}selected{% endif %}>Sim</option>
      <option value="NAO" {% if "NAO" in filtros.otd %}selected{% endif %}>Não</option>
      <option value="PENDENTE" {% if "PENDENTE" in filtros.otd %}selected{% endif %}>Pendente</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small text-muted mb-1">Modalidade de frete</label>
    <select class="form-select" name="frete" multiple size="5" title="Ctrl+clique (ou Cmd, no Mac) pra selecionar mais de uma opção">
      {% for op in FRETE_OPCOES %}
        <option value="{{ op }}" {% if op in filtros.frete %}selected{% endif %}>{{ op }}</option>
      {% endfor %}
      <option value="NAO_INFORMADO" {% if "NAO_INFORMADO" in filtros.frete %}selected{% endif %}>Não informado</option>
    </select>
  </div>
  <div class="col-md-1 d-grid pt-4">
    <a href="{{ url_for(endpoint_limpar) }}" class="btn btn-outline-secondary" title="Limpar todos os filtros"><i class="bi bi-eraser"></i></a>
  </div>
</div>
