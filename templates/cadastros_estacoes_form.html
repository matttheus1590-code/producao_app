{% extends "base.html" %}
{% block title %}{{ "Editar estação" if estacao else "Nova estação" }} · Controle de Produção{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">
    <i class="bi bi-diagram-3"></i> {{ "Editar estação" if estacao else "Nova estação" }}
  </h4>
  <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('cadastros_estacoes') }}">
    <i class="bi bi-arrow-left"></i> Voltar
  </a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small text-muted mb-1">Nome</label>
          <input type="text" class="form-control text-uppercase" name="nome" required
            value="{{ form.get('nome', estacao.nome if estacao else '') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label small text-muted mb-1">Meta de lead time (dias, opcional)</label>
          <input type="number" min="0" class="form-control" name="meta_lead_time_dias"
            value="{{ form.get('meta_lead_time_dias', estacao.meta_lead_time_dias if estacao and estacao.meta_lead_time_dias is not none else '') }}">
        </div>
        {% if estacao %}
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="ativo" id="campoAtivo" value="1" {% if estacao.ativo %}checked{% endif %}>
            <label class="form-check-label" for="campoAtivo">Estação ativa (aparece nos formulários de pedido)</label>
          </div>
        </div>
        {% endif %}
      </div>

      <div class="mt-4 d-flex justify-content-end">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Salvar</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
