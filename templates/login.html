{% extends "base.html" %}
{% block title %}Entrar · Gestão da Produção e Operação{% endblock %}
{% block content_login %}
<div class="row justify-content-center mt-5">
  <div class="col-11 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <img src="{{ url_for('static', filename='img/logo_4pipe.png') }}" alt="4PIPE Solutions" style="max-width: 220px; height: auto;">
          <h5 class="mt-3 mb-0 brand-destaque text-uppercase" style="letter-spacing: 0.03em;">Gestão da Produção e Operação</h5>
          <small class="text-muted">Acesse com seu usuário</small>
        </div>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input type="text" class="form-control" name="username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" name="senha" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">
      Usuário inicial: <code>admin</code> / senha: <code>admin123</code> — troque depois de entrar.
    </p>
  </div>
</div>
{% endblock %}
